# SOPS creation rules.
# Replace the age recipient below with the real cluster public key before
# encrypting anything (age-keygen -o age.agekey; keep the private key OUT of git).
# Flux decrypts with the `sops-age` secret in flux-system (see docs/runbooks/bootstrap.md).
creation_rules:
  - path_regex: clusters/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplaceh
  - path_regex: ansible/.*vault.*\.ya?ml$
    age: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplaceh
