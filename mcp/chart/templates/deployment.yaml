apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-server.name" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-server.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "mcp-server.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp-server.name" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: {{ include "mcp-server.image" . }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_LISTEN_ADDR
              value: {{ .Values.listenAddr | quote }}
            - name: GITHUB_OWNER
              value: {{ .Values.github.owner | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
