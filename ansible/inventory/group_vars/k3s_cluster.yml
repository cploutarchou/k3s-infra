---
# --- Network ---
vlan_iface: eth1
vlan_cidr: 10.0.0.0/24
vlan_prefix: 24
vlan_mtu: 1400 # netcup vLAN carries an overhead; keep below the public MTU
# k3s pod network (flannel VXLAN, k3s default cluster-cidr). Pods on a node
# reach that node's own host ports via the CNI bridge with a pod source
# address, so the nftables input chain needs an explicit accept for them.
k3s_cluster_cidr: 10.42.0.0/16
cni_iface: cni0
# Host ports pods may reach on their own node: etcd metrics, node-exporter,
# kubelet (metrics + cadvisor). Cross-node traffic is masqueraded to the
# node's vLAN IP and is covered by the vLAN rule.
pod_to_host_tcp_ports: [2381, 9100, 10250]

# --- k3s ---
# v1.34 ships etcd v3.6.x — starting fresh on 1.34 avoids the etcd
# 3.5 -> 3.6 zombie-member upgrade hazard entirely.
k3s_version: v1.34.11+k3s1
k3s_first_server: k3s-01
k3s_first_server_ip: 10.0.0.11
# kube-vip control-plane VIP on the vLAN (also in tls-san)
k3s_api_vip: 10.0.0.10
k3s_token_file: /etc/rancher/k3s/cluster-token

# --- etcd snapshots to Cloudflare R2 (EU jurisdiction) ---
etcd_snapshot_cron: "0 */6 * * *"
etcd_snapshot_retention: 28 # 7 days at 4/day
r2_endpoint: 035087c37abeda0a744ab1c4c482d19f.eu.r2.cloudflarestorage.com
r2_bucket: k3s-backups
r2_region: auto
# R2 credentials are NOT stored here. Provide them via the SOPS-encrypted
# vars file ansible/vault/r2-credentials.sops.yml (see vault/README.md):
#   r2_access_key_id: ...
#   r2_secret_access_key: ...
r2_access_key_id: ""
r2_secret_access_key: ""

# --- Hardening ---
ssh_permit_root_login: prohibit-password # key-only root; no password auth anywhere
unattended_upgrades: true
