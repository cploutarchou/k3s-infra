---
# Two replicas so the apex survives a node loss, which is cheap at this size.
# Runs unprivileged on 8080; /var/cache/nginx and /var/run are emptyDirs
# because the config volume is read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executionlab-site
  namespace: executionlab-site
  labels:
    app.kubernetes.io/name: executionlab-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: executionlab-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executionlab-site
      annotations:
        executionlab-site/content-revision: "2026-09-06.1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Without this the emptyDirs mount root-owned and nginx cannot create
        # /var/cache/nginx/client_temp, which fails the container at startup.
        # Verified by running the image locally under the same constraints.
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: executionlab-site
      containers:
        - name: nginx
          image: nginx:1.31.5-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: executionlab-site
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: executionlab-site
  namespace: executionlab-site
spec:
  selector:
    app.kubernetes.io/name: executionlab-site
  ports:
    - name: http
      port: 80
      targetPort: http
