---
# polyedge (github.com/cploutarchou/polyedge): research, paper-trading and
# risk platform. The image is published to GHCR by the app repo's Release
# image workflow after CI passes; pin the tag@digest from its job summary.
#
# One replica, Recreate, from the first apply: `serve` is a single writer
# (engine, dataset recorder, backtest recovery), so a rolling update would
# briefly run two writers, and the RWO datasets volume could not attach to
# both anyway. That is also why there is no second replica, topology
# spread or PodDisruptionBudget: a PDB on one replica would block drains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyedge
  namespace: polyedge
  labels:
    app.kubernetes.io/name: polyedge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polyedge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polyedge
      annotations:
        # Bump when a Secret changes: envFrom does not restart pods.
        polyedge/secret-revision: "1"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # The recorder drains its queue and the HTTP server shuts down within
      # POLYEDGE_SHUTDOWN_TIMEOUT (15s) on SIGTERM; leave room for both.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Forward-only, idempotent migrations under an advisory lock. `serve`
        # would also migrate, but a separate step fails visibly.
        - name: migrate
          image: ghcr.io/cploutarchou/polyedge:sha-a2233fb3d069@sha256:dfdd928b1ab96c09b7bec64fda8f3bc650a9519b3786b3c5f6728bc3ec3d78ff
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: polyedge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: polyedged
          image: ghcr.io/cploutarchou/polyedge:sha-a2233fb3d069@sha256:dfdd928b1ab96c09b7bec64fda8f3bc650a9519b3786b3c5f6728bc3ec3d78ff
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: polyedge
            - secretRef:
                name: polyedge
          volumeMounts:
            - name: datasets
              mountPath: /var/lib/polyedge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writes only under the data volume
            capabilities:
              drop: ["ALL"]
          # Readiness and liveness use /health/live on purpose. /health/ready
          # also fails while the database is down, and with one replica that
          # would remove the only endpoint and, with it, the UI and its
          # emergency stop, which keep working without the database. It also
          # fails while the engine waits on a full dataset queue, where a
          # restart would lose the queued inputs. Uptime Kuma watches
          # /health/ready instead (docs/runbooks/polyedge.md).
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: datasets
          persistentVolumeClaim:
            claimName: polyedge-datasets
