---
# Only Cloudflare may reach this app: requests that hit a node IP directly
# (80/443 are open to any source) are refused, so neither the Cloudflare
# edge nor CF-Connecting-IP can be bypassed or spoofed. Traefik sees the
# Cloudflare edge as the remote address (hostPort keeps the source IP).
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, retrieved
# 2026-10-01 (api.cloudflare.com/client/v4/ips etag
# 38f79d050aa027e3be3865e495dcc9bc); refresh them when Cloudflare changes
# its list.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: polyedge
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
# external-dns publishes the host against all three node IPs (target
# annotation, proxied through Cloudflare); certificate via DNS-01 on the
# cpdevlab.com zone. The UI, the API (/api/v1) and its WebSocket
# (/api/v1/ws) share the root of this host; the app has no base path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polyedge
  namespace: polyedge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "159.195.82.201,159.195.81.219,159.195.80.83"
    traefik.ingress.kubernetes.io/router.middlewares: polyedge-cloudflare-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - polyedge.cpdevlab.com
      secretName: polyedge-cpdevlab-com-tls
  rules:
    - host: polyedge.cpdevlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: polyedge
                port:
                  name: http
