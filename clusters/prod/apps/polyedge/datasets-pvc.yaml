---
# Recorded market data (append-only, checksummed datasets; 1.6-2.1 GB a
# day). Same trade-off as signwise: local-path pins the pod to one node, so
# losing that node stops polyedge until it returns. local-path does not
# enforce the 100Gi request: the real limit is k3s-03's root filesystem,
# which it shares with the CNPG replica postgres-2 and the node itself.
# Datasets are archived hourly to R2 (polyedge-datasets,
# dataset-archive.yaml); local pruning is not set up yet, so the disk keeps
# filling (runbook: Datasets and archiving).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polyedge-datasets
  namespace: polyedge
  annotations:
    # Never pruned by Flux: local-path deletes the data with the claim.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
