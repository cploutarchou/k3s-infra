---
# Recorded market data (append-only, checksummed datasets; about 2.1 GB a
# day measured on 2026-10-01). Same trade-off as signwise: local-path pins
# the pod to one node, so losing that node stops polyedge until it returns.
# 100Gi holds roughly 45 days. Datasets are archived hourly to R2
# (polyedge-datasets, dataset-archive.yaml); local pruning is not set up,
# so the 45-day ceiling still applies until a retention period is chosen.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polyedge-datasets
  namespace: polyedge
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
