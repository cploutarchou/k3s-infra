# Runtime secrets added with the audit queue 2 deployment.
#   BOT_API_TOKEN                  service token the backend presents to the bot
#                                  API (maps to a superuser principal there), so
#                                  lifecycle calls do not depend on forwarding
#                                  end-user tokens.
#   BOT_CREDENTIALS_ENCRYPTION_KEY base64, 32 bytes. Seals wallet credentials in
#                                  bot_instances.config. Losing it makes sealed
#                                  credentials unrecoverable; it is recoverable
#                                  from this file with the cluster age key.
