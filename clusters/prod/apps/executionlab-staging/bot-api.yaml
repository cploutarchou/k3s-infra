---
# Python trading runtime API (bot/, :8889). Reached only by the backend —
# the frontend never talks to it directly (strict frontend -> backend -> bot
# boundary), so it has no Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-api
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-api
spec:
  replicas: 1
  # bot-api supervises trading runtimes as child processes of this pod, so the
  # old pod is stopped before the replacement is created: maxSurge 0 with
  # maxUnavailable 1 on a single replica.
  #
  # This is RollingUpdate rather than Recreate on purpose. The live object was
  # created as RollingUpdate and holds an API-defaulted rollingUpdate block
  # that no field manager owns, so server-side apply cannot remove it, and the
  # API forbids that block next to type Recreate ("rollingUpdate: null" is
  # ignored by server-side apply; tried in 40f64e4).
  #
  # Unlike Recreate, the replacement can start while the old pod is still
  # terminating (up to the grace period below). The per-instance PostgreSQL
  # advisory lock is what stops a second trader during that window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-api
      annotations:
        executionlab/secret-revision: "2026-09-20.1"
    spec:
      # SIGTERM asks a runtime to finish the pair it is building (both legs, or
      # its emergency cleanup) and open nothing new. One entry with cleanup can
      # take over a minute; the default 30 s would SIGKILL it between two legs.
      terminationGracePeriodSeconds: 180
      containers:
        - name: bot-api
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-525be91b@sha256:27030cfcb8af79e115a7ad8e9c371d93d9b76ebb1d7323950bae64eb00af2ad1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8889
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
            - secretRef:
                name: executionlab-staging-runtime
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/dydx/backtest-artifacts
            - name: states
              mountPath: /app/bot_states
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: states
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bot-api
  namespace: executionlab-staging
spec:
  selector:
    app.kubernetes.io/name: bot-api
  ports:
    - name: http
      port: 8889
      targetPort: http
