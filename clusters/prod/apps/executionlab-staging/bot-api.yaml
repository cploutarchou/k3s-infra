---
# Python trading runtime API (bot/, :8889). Reached only by the backend —
# the frontend never talks to it directly (strict frontend -> backend -> bot
# boundary), so it has no Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-api
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-api
spec:
  replicas: 1
  # bot-api supervises trading runtimes as child processes of this pod. A
  # rolling update would start the replacement before the old pod (and its
  # children) stopped: two supervisors for the same instances. The app also
  # takes a per-instance PostgreSQL advisory lock, which would refuse the
  # second trader, but the deployment must not rely on that alone.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-api
      annotations:
        executionlab/secret-revision: "2026-09-20.1"
    spec:
      # SIGTERM asks a runtime to finish the pair it is building (both legs, or
      # its emergency cleanup) and open nothing new. One entry with cleanup can
      # take over a minute; the default 30 s would SIGKILL it between two legs.
      terminationGracePeriodSeconds: 180
      containers:
        - name: bot-api
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-c7c3a066@sha256:8617df0ea391534a4d1b3b0094f57d9e829aaa76076f29e7b67d8e13a94590e5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8889
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
            - secretRef:
                name: executionlab-staging-runtime
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/dydx/backtest-artifacts
            - name: states
              mountPath: /app/bot_states
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: states
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bot-api
  namespace: executionlab-staging
spec:
  selector:
    app.kubernetes.io/name: bot-api
  ports:
    - name: http
      port: 8889
      targetPort: http
