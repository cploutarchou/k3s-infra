---
# Schema changes run as explicit Jobs, never on application startup
# (DB_AUTO_MIGRATE stays false in the ConfigMap). The job name carries the
# app commit so a new revision creates a new Job rather than colliding with
# the completed, immutable one.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-41f64f74
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend-migrator:staging-41f64f74@sha256:925cf52b7653237c7687e4e2aa1e7999fa0aefc6e554e70e0b8a5de665cf2c51
          imagePullPolicy: IfNotPresent
          args: ["up"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# Alembic lives in the bot image already (bot/alembic.ini + bot/migrations,
# alembic==1.18.5 in requirements.txt), so the bot API image doubles as the
# bot migrator — no separate image to build or side-load.
apiVersion: batch/v1
kind: Job
metadata:
  name: bot-migrate-41f64f74
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-41f64f74@sha256:3b051dcc809b6de201428d3369b0f2f0dca330fc7e6f6d56a6910df57dbe45f0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
