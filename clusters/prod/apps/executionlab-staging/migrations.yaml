---
# Schema changes run as explicit Jobs, never on application startup
# (DB_AUTO_MIGRATE stays false in the ConfigMap). The job name carries the
# app commit so a new revision creates a new Job rather than colliding with
# the completed, immutable one.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-c7c3a066
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend-migrator:staging-c7c3a066@sha256:8370753af2b3c405fdb2ea6088bd1fee89a1c1db403707c639c98258f05a8d4c
          imagePullPolicy: IfNotPresent
          args: ["up"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# Alembic lives in the bot image already (bot/alembic.ini + bot/migrations,
# alembic==1.18.5 in requirements.txt), so the bot API image doubles as the
# bot migrator — no separate image to build or side-load.
apiVersion: batch/v1
kind: Job
metadata:
  name: bot-migrate-c7c3a066
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-c7c3a066@sha256:8617df0ea391534a4d1b3b0094f57d9e829aaa76076f29e7b67d8e13a94590e5
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
