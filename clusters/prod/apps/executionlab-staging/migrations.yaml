---
# Schema changes run as explicit Jobs, never on application startup
# (DB_AUTO_MIGRATE stays false in the ConfigMap). The job name carries the
# app commit so a new revision creates a new Job rather than colliding with
# the completed, immutable one.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-4fa3969e
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend-migrator:staging-4fa3969e@sha256:06f55c0fcdc26e204f310bc952671f7d04a1ce77d1fe3cb9e77a50ef69ff8c2e
          imagePullPolicy: IfNotPresent
          args: ["up"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# Alembic lives in the bot image already (bot/alembic.ini + bot/migrations,
# alembic==1.18.5 in requirements.txt), so the bot API image doubles as the
# bot migrator — no separate image to build or side-load.
apiVersion: batch/v1
kind: Job
metadata:
  name: bot-migrate-4fa3969e
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-4fa3969e@sha256:6ffbdd1c0309516662ce76044c8a2d5eb39b7006466fb57228d4246b944f1934
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
