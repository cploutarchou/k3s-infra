---
# Schema changes run as explicit Jobs, never on application startup
# (DB_AUTO_MIGRATE stays false in the ConfigMap). The job name carries the
# app commit so a new revision creates a new Job rather than colliding with
# the completed, immutable one.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-d87223af
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend-migrator:staging-d87223af@sha256:c7acd6d21a0600f432bc5f9dedc33c05b4d86492025be0e1fa35a7214a2e4ef9
          imagePullPolicy: IfNotPresent
          args: ["up"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# Alembic lives in the bot image already (bot/alembic.ini + bot/migrations,
# alembic==1.18.5 in requirements.txt), so the bot API image doubles as the
# bot migrator — no separate image to build or side-load.
apiVersion: batch/v1
kind: Job
metadata:
  name: bot-migrate-d87223af
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: bot-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-d87223af@sha256:c054d02bb1f7981ce9fd2853d594e460afe9b6f7a8ff1f875d1f0c4162c5f259
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
