---
# Hourly integrity check on the executionlab.io records that matter.
#
# Both apex SPF TXT records disappeared during the initial deployment with no
# delete issued from here (docs/runbooks/executionlab-staging.md). The cause
# was never established, so this makes a recurrence loud instead of silent:
# the Job exits non-zero, which surfaces on the "k3s Applications" dashboard
# under "time since last success" and "failed jobs by CronJob" for this
# namespace.
#
# It resolves against public recursive resolvers rather than the Cloudflare
# API on purpose — it tests what the world actually sees, and it keeps the
# Cloudflare token out of yet another workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-guard
  namespace: executionlab-staging
data:
  check.py: |
    """Fail if any critical executionlab.io DNS record is missing or malformed."""
    import sys
    import dns.resolver

    NODE_IPS = {"159.195.82.201", "159.195.81.219", "159.195.80.83"}
    # Mail moved from Cloudflare Email Routing to AWS SES (eu-central-1) on
    # 2026-09-14/15. SES receives (apex MX). Outbound mail is sent by the
    # self-hosted Plunk (namespace mailnexus), which delivers through SES.
    MX_HOSTS = {"inbound-smtp.eu-central-1.amazonaws.com."}
    SPF_INCLUDE = "amazonses.com"
    # Plunk registers a custom MAIL FROM domain with SES. That subdomain, not
    # the apex, is the envelope sender SPF is evaluated against, and it aligns
    # with executionlab.io for DMARC. Losing either record silently breaks SPF
    # for every message the platform sends.
    MAIL_FROM_DOMAIN = "plunk.executionlab.io"
    MAIL_FROM_MX_HOSTS = {"feedback-smtp.eu-central-1.amazonses.com."}
    # SES Easy DKIM publishes three CNAMEs <token>._domainkey -> <token>.dkim.amazonses.com.
    # The tokens are public DNS labels, not secrets. They come from SES:
    #   aws ses get-identity-dkim-attributes --identities executionlab.io \
    #     --region eu-central-1
    # (also shown on the Plunk project's domain page). They change only if Easy
    # DKIM is regenerated for the identity; an empty list fails on purpose.
    SES_DKIM_TOKENS = [
        "hrydieosne7cljqom6uasfedd6d6t7qe",
        "osx63rb2sodf63gjez4svx2dh4misfvo",
        "57wpmyoenshynj37efjhj2wzgq2r7wpf",
    ]

    resolver = dns.resolver.Resolver(configure=False)
    resolver.nameservers = ["1.1.1.1", "8.8.8.8", "9.9.9.9"]
    resolver.timeout, resolver.lifetime = 5, 15

    failures = []

    def lookup(name, rtype):
        try:
            return [r.to_text().strip('"') for r in resolver.resolve(name, rtype)]
        except dns.resolver.NoAnswer:
            # The name exists but has no record of this type: an empty answer,
            # which each check below reports in its own terms.
            return []
        except Exception as exc:
            failures.append(f"{rtype} {name}: lookup failed ({type(exc).__name__})")
            return None

    # Mail delivery: SES inbound.
    mx = lookup("executionlab.io", "MX")
    if mx is not None:
        hosts = {entry.split()[-1].lower() for entry in mx}
        if hosts != MX_HOSTS:
            failures.append(f"MX executionlab.io: expected {sorted(MX_HOSTS)}, got {sorted(hosts)}")

    # Outbound: the MAIL FROM subdomain must route bounces to SES and carry
    # exactly one SPF record that authorises it.
    mail_from_mx = lookup(MAIL_FROM_DOMAIN, "MX")
    if mail_from_mx is not None:
        hosts = {entry.split()[-1].lower() for entry in mail_from_mx}
        if hosts != MAIL_FROM_MX_HOSTS:
            failures.append(f"MX {MAIL_FROM_DOMAIN}: expected {sorted(MAIL_FROM_MX_HOSTS)}, got {sorted(hosts)}")

    mail_from_txt = lookup(MAIL_FROM_DOMAIN, "TXT")
    if mail_from_txt is not None:
        spf = [t for t in mail_from_txt if t.lower().startswith("v=spf1")]
        if len(spf) != 1:
            failures.append(f"TXT {MAIL_FROM_DOMAIN}: expected one SPF record, got {len(spf)}")
        elif SPF_INCLUDE not in spf[0]:
            failures.append(f"TXT {MAIL_FROM_DOMAIN}: SPF does not include {SPF_INCLUDE}: {spf[0]}")

    # Apex SPF. Platform mail does not depend on it (see MAIL FROM above), but
    # a domain with no SPF record gives receivers nothing to reject spoofed
    # apex senders with. Exactly one record — two is invalid under RFC 7208
    # and is the state this zone was in before the records vanished.
    apex_txt = lookup("executionlab.io", "TXT")
    if apex_txt is not None:
        spf = [t for t in apex_txt if t.lower().startswith("v=spf1")]
        if len(spf) == 0:
            failures.append("TXT executionlab.io: no SPF record")
        elif len(spf) > 1:
            failures.append(f"TXT executionlab.io: {len(spf)} SPF records, RFC 7208 allows one")
        elif SPF_INCLUDE not in spf[0]:
            failures.append(f"TXT executionlab.io: SPF does not include {SPF_INCLUDE}: {spf[0]}")

    # DKIM: SES Easy DKIM, one CNAME per token.
    if not SES_DKIM_TOKENS:
        failures.append("DKIM: SES_DKIM_TOKENS is empty in the dns-guard ConfigMap; "
                        "fill in the three selectors from the Plunk domain page or the SES console")
    for token in SES_DKIM_TOKENS:
        name = f"{token}._domainkey.executionlab.io"
        want = f"{token}.dkim.amazonses.com."
        cname = lookup(name, "CNAME")
        if cname is not None and [c.lower() for c in cname] != [want]:
            failures.append(f"CNAME {name}: expected {want}, got {cname}")

    dmarc = lookup("_dmarc.executionlab.io", "TXT")
    if dmarc is not None and not any(t.lower().startswith("v=dmarc1") for t in dmarc):
        failures.append("TXT _dmarc: not a DMARC record")

    # Staging hosts. staging is proxied so its addresses are Cloudflare's and
    # will change; only assert that it resolves. api.staging is DNS-only, so
    # its addresses are ours and are worth asserting exactly.
    if lookup("staging.executionlab.io", "A") == []:
        failures.append("A staging.executionlab.io: no addresses")

    api_a = lookup("api.staging.executionlab.io", "A")
    if api_a is not None and set(api_a) != NODE_IPS:
        failures.append(f"A api.staging.executionlab.io: expected the three nodes, got {sorted(api_a)}")

    if failures:
        for line in failures:
            print(f"FAIL {line}", file=sys.stderr)
        sys.exit(1)
    print("ok: mail (SES MX, Plunk MAIL FROM, SPF, DKIM, DMARC) and both staging hosts resolve as expected")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-guard
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: dns-guard
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dns-guard
        spec:
          restartPolicy: Never
          containers:
            - name: check
              # Reuses the bot API image purely because it already carries
              # dnspython and is side-loaded on every node — no extra pull.
              image: ghcr.io/cploutarchou/dydx-trading-bot/api:staging-c1082651@sha256:bb26c5925e27b3383d770657fb6ad88dc1cfddb9cee98a06d18d410dfb9699b7
              imagePullPolicy: IfNotPresent
              command: ["python", "/opt/dns-guard/check.py"]
              volumeMounts:
                - name: script
                  mountPath: /opt/dns-guard
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 192Mi
          volumes:
            - name: script
              configMap:
                name: dns-guard
