---
# Celery worker. It registers exactly two tasks — bot.sync_market_candles
# (market data ingest) and the backtest task
# (bot/src/infrastructure/workers/{market_sync,backtest}_tasks.py). Neither
# places, modifies, or cancels an exchange order: live execution runs in the
# per-instance runtime (bot/src/main_instance.py), which is started only from
# the bot API and reads its credentials and is_testnet flag from the database.
# CELERY_QUEUES is pinned in the ConfigMap so the worker cannot pick up a
# queue added later without a manifest change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        executionlab/secret-revision: "2026-09-20.3"
    spec:
      containers:
        - name: worker
          image: ghcr.io/cploutarchou/dydx-trading-bot/worker:staging-4fa3969e@sha256:142d1bd7f5c7d4e147ec9fdb1e1b2ba2a0e80f9be95e2d481ea9ccd75fd9cce3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
            - secretRef:
                name: executionlab-staging-runtime
          # The image bakes APP_ENV=prod; the ConfigMap above overrides it to
          # staging, which is what puts the Go baseline and this runtime on the
          # same environment label.
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - celery -A src.infrastructure.workers.celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/dydx/backtest-artifacts
            - name: states
              mountPath: /app/bot_states
          # Memory: the worker idles at ~540Mi once both prefork children have
          # run a backtest, and a long all-market run adds ~200Mi per child. At
          # the old 768Mi limit the kernel OOM-killed the container mid-run
          # (2026-09-20 21:55 UTC), which takes every in-flight backtest with it
          # and leaves them "stale". The request tracks steady-state use; the
          # limit leaves room for two large runs at once.
          resources:
            requests:
              cpu: 150m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: states
          emptyDir: {}
