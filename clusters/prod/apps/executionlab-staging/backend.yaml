---
# Go gateway (backend/, :8888). Images are side-loaded on all three nodes via
# ansible/playbooks/30-sideload-image.yml — the operator's PAT still has no
# packages scope and these GHCR repos are private (docs/decisions.md), so
# imagePullPolicy stays IfNotPresent and the digest is the one containerd
# assigned on import.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        executionlab/secret-revision: "2026-09-20.3"
    spec:
      containers:
        - name: backend
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend:staging-b04f92c2@sha256:c1e4576ee61dfc693a4e7ece752f06222c1a9b361a4a57f2dee6394fcc21e690
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: executionlab-config
            - secretRef:
                name: executionlab-staging
            - secretRef:
                name: executionlab-staging-runtime
          # /ready reports on the database and the bot API, so readiness
          # genuinely gates on dependencies being reachable.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: executionlab-staging
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8888
      targetPort: http
