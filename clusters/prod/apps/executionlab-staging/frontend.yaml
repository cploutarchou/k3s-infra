---
# nginx serving the built React bundle. The stock image needs no staging
# rebuild: frontend/src/api/origin.ts classifies staging.executionlab.io as
# the staging environment, rejects the build-time production API base for
# that environment, and falls through to https://api.staging.executionlab.io.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/cploutarchou/dydx-trading-bot/frontend:staging-0d88f1d5@sha256:4370045a7b218145465a98fc0f9af02f7dfb4740149a29f961b884460acf4dd4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: executionlab-staging
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
