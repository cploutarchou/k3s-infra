---
# NATS JetStream for durable backtest lifecycle/progress events. The bot worker
# publishes backtest.event.<action>; the backend projects them onto the
# user-facing push feed. Celery remains the authoritative backtest executor —
# BOT_COMMAND_BUS_ENABLED stays false in the ConfigMap so a Celery-owned run is
# never replayed by a NATS command worker.
#
# Mirrors the app's own compose service (nats:2.10-alpine, -js, monitoring on
# 8222). Like valkey, staging state is disposable, so the JetStream store is an
# emptyDir: a restart loses retained events, which only costs replay history
# for runs that were in flight. JetStream is capped below the volume and the
# memory limit so it cannot take the node's disk or get the pod OOM-killed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: executionlab-staging
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: /data
      max_memory_store: 64MB
      max_file_store: 1GB
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: executionlab-staging
  labels:
    app.kubernetes.io/name: nats
spec:
  replicas: 1
  # One JetStream server owns the store; never run two against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: executionlab-staging
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
