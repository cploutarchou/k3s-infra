---
# Next.js 16 standalone server (github.com/cploutarchou/signwise, 1.1.1).
# Images are side-loaded on all three nodes under these digests via
# ansible/playbooks/31-sideload-image-bundle.yml (no registry pull path yet —
# see docs/decisions.md); imagePullPolicy stays IfNotPresent.
# NEXT_PUBLIC_SITE_URL is baked into the client bundle at build time, so a
# hostname change means a rebuild, not just an env edit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signwise
  namespace: signwise
  labels:
    app.kubernetes.io/name: signwise
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO uploads volume
  selector:
    matchLabels:
      app.kubernetes.io/name: signwise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signwise
    spec:
      initContainers:
        # `pnpm db:migrate` (drizzle migrator, ./drizzle SQL files) from the
        # tools image. Safe with replicas: 1; move to a Job if replicas grow.
        - name: migrate
          image: ghcr.io/cploutarchou/signwise-tools:1.1.1@sha256:056058047a5de7a353d1b2d6dc207510a59a77a8483d1ef39e90ad832492dbb9
          imagePullPolicy: IfNotPresent
          args: ["db:migrate"]
          envFrom:
            - secretRef:
                name: signwise
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: web
          image: ghcr.io/cploutarchou/signwise:1.1.1@sha256:3647d2bc1e4a13d770babf11d98b729388f48f623f13e9740c82671faa71e799
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_SITE_URL
              value: https://signwise.cpdevlab.com
            # Environment fallback only: delivery is configured by an
            # administrator at /admin/settings/email (Plunk on
            # api.cpdevlab.com; the secret key is stored encrypted in the
            # database, see docs/runbooks/signwise.md). With no CMS choice the
            # app logs enquiry notifications instead of sending them.
            - name: EMAIL_PROVIDER
              value: console
            - name: EMAIL_FROM
              value: Signwise <no-reply@cpdevlab.com>
            # Pre-fills the Plunk API base on the CMS page (self-hosted Plunk).
            - name: PLUNK_API_URL
              value: https://api.cpdevlab.com
            # Traefik rewrites X-Forwarded-For to the Cloudflare edge address, so
            # rate limits key on the real visitor IP that Cloudflare forwards.
            - name: TRUSTED_IP_HEADER
              value: cf-connecting-ip
            - name: MEDIA_STORAGE
              value: local
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: signwise
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          # /api/health runs `select 1`, so readiness also gates on the
          # database being reachable and migrated.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: signwise-uploads
