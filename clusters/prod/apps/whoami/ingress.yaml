---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: whoami
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Traefik runs with publishedService disabled (hostPorts), so ingresses
    # carry no status address; external-dns needs explicit targets.
    external-dns.alpha.kubernetes.io/target: "159.195.82.201,159.195.81.219,159.195.80.83"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cpdevlab.com
        - www.cpdevlab.com
        - whoami.cpdevlab.com
      secretName: cpdevlab-com-tls
  rules:
    - host: whoami.cpdevlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
    - host: cpdevlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
    - host: www.cpdevlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
