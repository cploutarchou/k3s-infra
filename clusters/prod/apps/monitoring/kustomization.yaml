---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepos.yaml
  - victoria-metrics.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - grafana-admin-secret.sops.yaml
  - grafana.yaml
  - uptime-kuma.yaml

# Custom Grafana dashboards (see scripts/gen-dashboards.py). Fixed name so
# the HelmRelease can reference it via dashboardsConfigMaps.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboards-custom
    namespace: monitoring
    files:
      - dashboards/cluster-overview.json
      - dashboards/platform.json
      - dashboards/databases.json
      - dashboards/applications.json
