---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.56.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: node-exporter
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
