---
# Scheduled publishing + GitHub/package sync. Both hit the app's own API
# over the cluster network using the shared CRON_SECRET; the runtime image
# (published to GHCR by the repository's "Release image" workflow) is reused
# for its /app/cron binary, so no extra image is needed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-publish-scheduled
  namespace: website
spec:
  schedule: "*/15 * * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Finished Jobs (and their pods) are removed after 7 days; the history
      # limits above still cap how many are kept before that.
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: publish
              image: ghcr.io/cploutarchou/personal-website:0.4.1@sha256:f6cb4ac0acb3995be6cc26497d3090f796e1dffde9580c9f59dd24c0b0e51b77
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - publish-scheduled
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-sync-external
  namespace: website
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Finished Jobs (and their pods) are removed after 7 days; the history
      # limits above still cap how many are kept before that.
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/cploutarchou/personal-website:0.4.1@sha256:f6cb4ac0acb3995be6cc26497d3090f796e1dffde9580c9f59dd24c0b0e51b77
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - sync
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
