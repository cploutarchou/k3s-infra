---
# Scheduled publishing + GitHub/package sync. Both hit the app's own API
# over the cluster network using the shared CRON_SECRET; the runtime image
# is reused (its /app/cron binary), pulled from GHCR with the ghcr-pull secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-publish-scheduled
  namespace: website
spec:
  schedule: "*/15 * * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Finished Jobs (and their pods) are removed after 7 days; the history
      # limits above still cap how many are kept before that.
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: publish
              image: ghcr.io/cploutarchou/personal-website:0.5.0@sha256:fc8fdc77b81c2c125ec0396d6f930e2e1535fd937fbae253606d72f52e2b7c2e
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - publish-scheduled
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-sync-external
  namespace: website
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Finished Jobs (and their pods) are removed after 7 days; the history
      # limits above still cap how many are kept before that.
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/cploutarchou/personal-website:0.5.0@sha256:fc8fdc77b81c2c125ec0396d6f930e2e1535fd937fbae253606d72f52e2b7c2e
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - sync
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
