---
# Scheduled publishing + GitHub/package sync. Both hit the app's own API
# over the cluster network using the shared CRON_SECRET; the runtime image
# is reused (its /app/cron binary) so no extra image needs side-loading.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-publish-scheduled
  namespace: website
spec:
  schedule: "*/15 * * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: publish
              image: ghcr.io/cploutarchou/personal-website:0.4.0@sha256:5a89ef7122ef5da67c1de15048612d5ceef97f89eff89f27f89bef4d0e55b0e5
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - publish-scheduled
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-sync-external
  namespace: website
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Nicosia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/cploutarchou/personal-website:0.4.0@sha256:5a89ef7122ef5da67c1de15048612d5ceef97f89eff89f27f89bef4d0e55b0e5
              imagePullPolicy: IfNotPresent
              command:
                - /app/cron
                - --base
                - http://website.website.svc
                - sync
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: website
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
