---
# One-shot seed of the website database. prisma/seed.ts is idempotent
# (upserts by fixed ids), so a re-run is safe. The Job is kept in git as a
# record of the bootstrap; delete it once content is managed through the
# admin CMS. Bump the suffix to re-run — a completed Job is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: website-seed-2
  namespace: website
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/cploutarchou/personal-website-seed:0.2.4@sha256:64d84855f10ff1373a020bf73a34b2d7075644a848eda8f06a42056df5ccb121
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: website
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
