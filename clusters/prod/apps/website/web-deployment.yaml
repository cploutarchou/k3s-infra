---
# Go + Gin binary (github.com/cploutarchou/my-personal-website, 0.4.0).
# Image is side-loaded on all three nodes under this digest via
# ansible/playbooks/30-sideload-image.yml (no registry pull path yet — see
# docs/decisions.md); imagePullPolicy stays IfNotPresent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  labels:
    app.kubernetes.io/name: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
      annotations:
        # Bump to roll the pod after a change to the website secret
        # (envFrom does not restart pods on its own).
        website/secret-revision: "2026-09-05.1"
    spec:
      initContainers:
        # Runs `/app/migrate up` (goose; the Prisma history is baselined on
        # first run) before the app starts. Safe with replicas: 1; revisit
        # (migration Job) if replicas grow.
        - name: migrate
          image: ghcr.io/cploutarchou/personal-website-migrate:0.4.0@sha256:3da6c21f87dec9711fd6356a587d0038a32ef14233182593ba6a7acc758a4c8b
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: website
          # The migrator shares the server's environment validation, which
          # requires the OAuth settings and the canonical URL together.
          env:
            - name: SITE_URL
              value: https://christosploutarchou.com
            - name: NEXTAUTH_URL
              value: https://christosploutarchou.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: web
          image: ghcr.io/cploutarchou/personal-website:0.4.0@sha256:5a89ef7122ef5da67c1de15048612d5ceef97f89eff89f27f89bef4d0e55b0e5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SITE_URL
              value: https://christosploutarchou.com
            - name: NEXTAUTH_URL
              value: https://christosploutarchou.com
            - name: SITE_TIMEZONE
              value: Asia/Nicosia
            - name: ADMIN_GITHUB_ID
              value: "49656626"
            - name: ADMIN_GITHUB_LOGIN
              value: cploutarchou
            # Read at runtime by the Go server (build arguments of the former
            # Next.js image).
            - name: NEXT_PUBLIC_X_PROFILE_URL
              value: https://x.com/CPloutarchou
            - name: NEXT_PUBLIC_FACEBOOK_PROFILE_URL
              value: https://www.facebook.com/profile.php?id=100085180671631
          envFrom:
            - secretRef:
                name: website
          # /api/health runs a real query, so readiness also gates on the
          # database being reachable and migrated.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
