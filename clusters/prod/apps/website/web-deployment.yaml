---
# Go + Gin binary (github.com/cploutarchou/my-personal-website, 0.4.1).
# The image is published to GHCR by the repository's "Release image"
# workflow (tag = frontend/package.json version, plus sha-<commit>) and is
# pinned here by digest; the package is public so no pull secret is needed.
# imagePullPolicy IfNotPresent is safe with a digest reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  labels:
    app.kubernetes.io/name: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
      annotations:
        # Bump to roll the pod after a change to the website secret
        # (envFrom does not restart pods on its own).
        website/secret-revision: "2026-09-05.1"
    spec:
      initContainers:
        # Runs `/app/migrate up` (goose; the Prisma history is baselined on
        # first run) before the app starts, using the runtime image. Safe
        # with replicas: 1; revisit (migration Job) if replicas grow.
        - name: migrate
          image: ghcr.io/cploutarchou/personal-website:0.4.1@sha256:f6cb4ac0acb3995be6cc26497d3090f796e1dffde9580c9f59dd24c0b0e51b77
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate", "up"]
          envFrom:
            - secretRef:
                name: website
          # The migrator shares the server's environment validation, which
          # requires the OAuth settings and the canonical URL together.
          env:
            - name: SITE_URL
              value: https://christosploutarchou.com
            - name: NEXTAUTH_URL
              value: https://christosploutarchou.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: web
          image: ghcr.io/cploutarchou/personal-website:0.4.1@sha256:f6cb4ac0acb3995be6cc26497d3090f796e1dffde9580c9f59dd24c0b0e51b77
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SITE_URL
              value: https://christosploutarchou.com
            - name: NEXTAUTH_URL
              value: https://christosploutarchou.com
            - name: SITE_TIMEZONE
              value: Asia/Nicosia
            - name: ADMIN_GITHUB_ID
              value: "49656626"
            - name: ADMIN_GITHUB_LOGIN
              value: cploutarchou
            # Read at runtime by the Go server (build arguments of the former
            # Next.js image).
            - name: NEXT_PUBLIC_X_PROFILE_URL
              value: https://x.com/CPloutarchou
            - name: NEXT_PUBLIC_FACEBOOK_PROFILE_URL
              value: https://www.facebook.com/profile.php?id=100085180671631
          envFrom:
            - secretRef:
                name: website
          # /api/health runs a real query, so readiness also gates on the
          # database being reachable and migrated.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
