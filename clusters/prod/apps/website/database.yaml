---
# Declarative database on the shared CNPG cluster (one database per app —
# see CLAUDE.md). The `website` role itself is a managed role on the
# Cluster spec (infrastructure/configs/postgres/cluster.yaml); its password
# lives in website-db-credentials.sops.yaml in the databases namespace.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: website
  namespace: databases
spec:
  cluster:
    name: postgres
  name: website
  owner: website
