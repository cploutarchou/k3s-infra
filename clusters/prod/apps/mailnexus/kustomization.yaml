---
# MailNexus (Plunk on Amazon SES) in namespace mailnexus, plus the daily
# PostgreSQL backup to R2 and its weekly restore test. Not listed, on
# purpose: the dashboard-allowlist Traefik middleware (it holds the admin
# IP, and this repository is public; it is managed by hand, see
# docs/runbooks/mailnexus.md) and the TLS secrets cert-manager creates.
# No labels, commonLabels or namespace transformers here: they would
# change the Deployment selectors, which are immutable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - mailnexus-secrets.sops.yaml
  - config.yaml
  - data-pvcs.yaml
  - postgres.yaml
  - redis.yaml
  - ntfy.yaml
  - plunk.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - mailnexus-postgres-backup.sops.yaml
  - mailnexus-restore-test.sops.yaml
  - postgres-backup-networkpolicy.yaml
  - postgres-backup.yaml
  - postgres-restore-test.yaml
configMapGenerator:
  # The backup and restore-test scripts; the hash suffix rolls both
  # CronJobs onto a new ConfigMap whenever a script changes.
  - name: mailnexus-postgres-backup
    namespace: mailnexus
    files:
      - pg-backup-dump.sh
      - pg-backup-upload.sh
      - pg-restore-test-fetch.sh
      - pg-restore-test.sh
      - pg-restore-test-report.sh
