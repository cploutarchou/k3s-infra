---
# local-path volumes on k3s-01 (node label mailnexus.io/data=true). Never
# pruned by Flux; local-path deletes the data with the claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mailnexus
  name: plunk-data
  namespace: mailnexus
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
