---
# api.cpdevlab.com (Plunk API), app.cpdevlab.com (dashboard, behind the
# dashboard-allowlist Traefik middleware, which is managed outside Git) and
# docs.cpdevlab.com (Plunk's docs). TLS from cert-manager, DNS records
# from external-dns.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/target: 159.195.82.201,159.195.81.219,159.195.80.83
  name: mailnexus
  namespace: mailnexus
spec:
  ingressClassName: traefik
  rules:
  - host: api.cpdevlab.com
    http:
      paths:
      - backend:
          service:
            name: plunk
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - api.cpdevlab.com
    secretName: mailnexus-api-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/target: 159.195.82.201,159.195.81.219,159.195.80.83
    traefik.ingress.kubernetes.io/router.middlewares: mailnexus-dashboard-allowlist@kubernetescrd
  name: mailnexus-dashboard
  namespace: mailnexus
spec:
  ingressClassName: traefik
  rules:
  - host: app.cpdevlab.com
    http:
      paths:
      - backend:
          service:
            name: plunk
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - app.cpdevlab.com
    secretName: mailnexus-dashboard-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: 159.195.82.201,159.195.81.219,159.195.80.83
  name: mailnexus-docs
  namespace: mailnexus
spec:
  ingressClassName: traefik
  rules:
  - host: docs.cpdevlab.com
    http:
      paths:
      - backend:
          service:
            name: plunk
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - docs.cpdevlab.com
    secretName: mailnexus-docs-tls
