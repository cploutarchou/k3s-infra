---
# ntfy, Plunk's internal notification channel (cluster-internal only).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mailnexus
  name: ntfy
  namespace: mailnexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      containers:
      - args:
        - serve
        image: binwiederhier/ntfy:v2.16.0
        livenessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        name: ntfy
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mailnexus
  name: ntfy
  namespace: mailnexus
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: ntfy
