---
# Canonical host. external-dns publishes each host against all three node
# IPs (target annotation), certificates via DNS-01 on the widened
# Cloudflare token (see cert-manager cluster-issuer dnsZones).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gvasiliourolex
  namespace: gvasiliourolex
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "159.195.82.201,159.195.81.219,159.195.80.83"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gvasiliourolex.com.cy
      secretName: gvasiliourolex-com-cy-tls
  rules:
    - host: gvasiliourolex.com.cy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gvasiliourolex
                port:
                  name: http
---
# www 301s to the canonical apex. Traefik v3 CRD middleware; only attached
# to the alias ingress so the canonical host cannot redirect-loop.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-canonical
  namespace: gvasiliourolex
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://gvasiliourolex.com.cy/${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gvasiliourolex-aliases
  namespace: gvasiliourolex
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "159.195.82.201,159.195.81.219,159.195.80.83"
    traefik.ingress.kubernetes.io/router.middlewares: gvasiliourolex-redirect-to-canonical@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.gvasiliourolex.com.cy
      secretName: www-gvasiliourolex-com-cy-tls
  rules:
    - host: www.gvasiliourolex.com.cy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gvasiliourolex
                port:
                  name: http
