# Chart comes from this repo (mcp/chart) via the flux-system GitRepository.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-server
  namespace: mcp
spec:
  interval: 30m
  chart:
    spec:
      chart: ./mcp/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  # Correct manual drift (e.g. an emergency `kubectl scale`) on every
  # reconcile, so this file is the only lever. To stop the server, set
  # replicaCount: 0 here; to pause reconciliation, suspend the HelmRelease.
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mcp-server
    # Image is side-loaded on all three nodes (containerd import) under this
    # digest; no registry, no pull secret. See docs/decisions.md — a GHCR
    # push is pending on a packages-scoped token.
    image:
      repository: ghcr.io/cploutarchou/k3s-infra-mcp
      digest: sha256:fcd7674b5147a7de66f380febc40f2e40a25f8b50908f370e3ea47254045be50
      tag: 0.3.0
    existingSecret: mcp-server
    auth:
      # Handshake (initialize, tools/list, ping) stays anonymous so the
      # claude.ai connector can probe before its key is set; tools/call and
      # any presented credential are always checked. false = key everywhere.
      publicHandshake: true
    # Bump after rotating api-key in mcp-server-secret.sops.yaml: the key is
    # read at container start, and this forces the rollout.
    podAnnotations:
      k3s-infra.cpdevlab.com/secret-rotated-at: "2026-09-14"
    github:
      owner: cploutarchou
      repo: k3s-infra
    ingress:
      enabled: true
      host: mcp.cpdevlab.com
      className: traefik
      clusterIssuer: letsencrypt-prod
      annotations:
        external-dns.alpha.kubernetes.io/target: 159.195.82.201,159.195.81.219,159.195.80.83