---
# Shared postgres for all apps: 1 primary + 2 replicas, one instance per
# node (CNPG default anti-affinity), WAL archiving + base backups to R2.
# Apps get one database each on this cluster (Database CR or managed roles);
# no ad-hoc database containers.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 3
  # Latest 17.x (not 18): see docs/decisions.md. Multi-arch digest verified
  # against ghcr 2026-08-31.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:0eea5ac8c5e3043db94f4d512ffcfb9c06d6270a97f6d56e9f08e1571ef0484e
  primaryUpdateStrategy: unsupervised

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  storage:
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "120"
      shared_buffers: 256MB
      effective_cache_size: 768MB

  # WAL archiving + backups via the Barman Cloud Plugin (see
  # objectstore.yaml); in-tree barmanObjectStore is unusable with the
  # -standard- images (no barman binaries).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store
