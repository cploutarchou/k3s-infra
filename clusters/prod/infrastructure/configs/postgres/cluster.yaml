---
# Shared postgres for all apps: 1 primary + 2 replicas, one instance per
# node (CNPG default anti-affinity), WAL archiving + base backups to R2.
# Apps get one database each on this cluster (Database CR or managed roles);
# no ad-hoc database containers.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 3
  # 18.6-standard-trixie multi-arch digest, verified against ghcr 2026-08-31
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152
  primaryUpdateStrategy: unsupervised

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  storage:
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "120"
      shared_buffers: 256MB
      effective_cache_size: 768MB

  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://k3s-backups/postgres
      endpointURL: https://035087c37abeda0a744ab1c4c482d19f.eu.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: r2-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: r2-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        # CRD only allows bzip2|gzip|snappy for base-backup data
        compression: snappy
