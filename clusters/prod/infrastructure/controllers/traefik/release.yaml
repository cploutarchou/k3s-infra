---
# DaemonSet with hostPorts 80/443: every node terminates ingress on its
# public IP (Cloudflare proxies in front). The bundled k3s Traefik and
# servicelb are disabled in the k3s config.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.4.0" # traefik v3.7.12
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    deployment:
      kind: DaemonSet
    service:
      enabled: true
      type: ClusterIP
    ports:
      web:
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        hostPort: 443
        # http.tls.enabled defaults to true on websecure in chart 41.x
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      runAsNonRoot: false
      runAsUser: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    readinessProbe:
      failureThreshold: 1
      initialDelaySeconds: 2
      periodSeconds: 10
    log:
      level: INFO
