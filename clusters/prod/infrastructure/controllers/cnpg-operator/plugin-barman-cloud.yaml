---
# Barman Cloud Plugin (CNPG-i): WAL archiving + base backups for CNPG >=1.26.
# The -standard- postgres images no longer bundle barman-cloud binaries, so
# in-tree spec.backup.barmanObjectStore cannot work; the plugin replaces it.
# Uses cert-manager for its internal TLS (present in this layer).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
